<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet"/>
  <title>Frontend Mentor | Interactive pricing component</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
  <section class="pricing-card">
    <h1>Simple, traffic-based pricing</h1>
    
    <p>Sign-up for our 30-day trial. <span>No credit card required.</span></p>
    
    <img src="images/pattern-circles.svg" alt="">
  </section>
  <section class="pricing-feature">
    <div class="price-details" aria-live="polite">
      <h2><span class="views-count"></span> Pageviews</h2>
      <p><span class="price"></span> /month</p>
    </div>
    <div class="progress-bar">
      
      <input type="range" class="slider-input" min="0" max="4" step="1" value="2" aria-label="Monthly pageviews">
      
    </div>
    <div class="billing">
      <p class="month">Monthly Billing</p>
      <label class="switch"><input type="checkbox" aria-label="Bill yearly"><span class="switch-slider"></span></label>
      <div class="yearly-billing">
        <p class="year">Yearly Billing </p>
        <p class="discount"><span span class="discount-value">-25% </span><span class="discount-text">discount</span></p>
      </div>
    </div>
    <div class="cta">
      <div class="cta-text">
        <p><img src="images/icon-check.svg" alt="">Unlimited websites</p>
        <p><img src="images/icon-check.svg" alt="">100% data ownership</p>
        <p><img src="images/icon-check.svg" alt="">Email reports</p> 
      </div>
      <button type="button" class="btn">  Start my trial</button>
    </div>
  </section>
  
  <script src="script.js"></script>
</body>
</html>
